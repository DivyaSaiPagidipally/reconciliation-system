services:
  db:
    image: postgres:16
    container_name: reconciliation-db
    environment:
      POSTGRES_USER: recon
      POSTGRES_PASSWORD: recon
      POSTGRES_DB: reconciliation
    ports:
      - "5433:5432"
    volumes:
      - recon_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recon -d reconciliation"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  recon_pgdata: